name: Barka Tunnel - déploiement ciblé VPS (préserver l'existant)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-barka-targeted.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: barka-vps-targeted-deployment
  cancel-in-progress: false

jobs:
  deploy-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Vérifier les sources GitHub sans modifier le backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Valider les fichiers de la mise à jour 2.4.1.2 (145)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          grep -q 'versionCode = 145' app/build.gradle.kts
          grep -q 'versionName = "2.4.1.2"' app/build.gradle.kts
          python3 -m py_compile backend/recovery/barka_vps_targeted.py
          test -f backend/recovery/barka_vps_targeted.py

      # Ne pas dépendre d'un ancien artefact, ni des API GitHub de recherche.
      # Reproduit les étapes de build/signature/ABI de build-clean.yml,
      # tout en conservant le déploiement ciblé et ses contrôles VPS.
      - name: Préparer Java 17 pour Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Go 1.24 pour les moteurs DNSTT
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Installer Python 3.12 pour valider le backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests du backend original GitHub (lecture seule)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          PYTHONPATH=backend python -m pytest backend/tests -q

      - name: Préparer les moteurs natifs C6 existants
        shell: bash
        run: bash ./scripts/c6_prepare_native.sh

      - name: Configurer Gradle 8.9 sans réutiliser le cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Charger la signature Android habituelle depuis GitHub Secrets
        shell: bash
        env:
          BARKA_KEYSTORE_BASE64: ${{ secrets.BARKA_KEYSTORE_BASE64 }}
          BARKA_KEY_ALIAS_SECRET: ${{ secrets.BARKA_KEY_ALIAS }}
          BARKA_STORE_PASSWORD_SECRET: ${{ secrets.BARKA_STORE_PASSWORD }}
          BARKA_KEY_PASSWORD_SECRET: ${{ secrets.BARKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BARKA_KEYSTORE_BASE64" || { echo "STOP : clé de signature manquante"; exit 1; }
          test -n "$BARKA_KEY_ALIAS_SECRET" && test -n "$BARKA_STORE_PASSWORD_SECRET" && test -n "$BARKA_KEY_PASSWORD_SECRET"
          KEYSTORE_PATH="$RUNNER_TEMP/barka-tunnel-release.jks"
          printf '%s' "$BARKA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$BARKA_STORE_PASSWORD_SECRET" -alias "$BARKA_KEY_ALIAS_SECRET" >/dev/null
          echo "BARKA_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "BARKA_SIGNING_STORE_PASSWORD=$BARKA_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "BARKA_SIGNING_KEY_ALIAS=$BARKA_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          echo "BARKA_SIGNING_KEY_PASSWORD=$BARKA_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"

      - name: Compiler l'APK 2.4.1.2 (145) avec les moteurs natifs
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleRelease --no-daemon --no-build-cache --rerun-tasks --stacktrace
          gradle testReleaseUnitTest --no-daemon --no-build-cache --stacktrace

      - name: Contrôler ARM64, ARMv7 et préparer l'APK signé
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_SOURCE"
          APK_ENTRIES="$(unzip -Z1 "$APK_SOURCE")"
          for abi in arm64-v8a armeabi-v7a; do
            for core in libbarka_xray.so libbarka_dnstt.so libtun2socks.so; do
              grep -Fxq "lib/$abi/$core" <<< "$APK_ENTRIES" || {
                echo "STOP : moteur absent : lib/$abi/$core"
                exit 1
              }
            done
          done
          mkdir -p staged
          cp "$APK_SOURCE" staged/BarkaTunnel-release.apk
          unzip -tq staged/BarkaTunnel-release.apk
          test "$(stat -c '%s' staged/BarkaTunnel-release.apk)" -gt 1000000
          sha256sum staged/BarkaTunnel-release.apk
          echo 'APK_SIGNÉ=PRÊT_VERSION_2.4.1.2_CODE_145'

      - name: Conserver l'APK signé dans les artefacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: BarkaTunnel-APK
          path: staged/BarkaTunnel-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Installer et vérifier les accès SSH déjà configurés
        shell: bash
        env:
          BARKA_VPS_HOST: ${{ secrets.BARKA_VPS_HOST }}
          BARKA_VPS_USER: ${{ secrets.BARKA_VPS_USER }}
          BARKA_VPS_SSH_KEY: ${{ secrets.BARKA_VPS_SSH_KEY }}
          BARKA_VPS_PORT: ${{ secrets.BARKA_VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "$BARKA_VPS_HOST" && test -n "$BARKA_VPS_USER" && test -n "$BARKA_VPS_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$BARKA_VPS_SSH_KEY" > "$HOME/.ssh/barka_vps_key"
          chmod 600 "$HOME/.ssh/barka_vps_key"
          ssh-keyscan -p "${BARKA_VPS_PORT:-22}" -H "$BARKA_VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Déployer seulement 5 fichiers Python et l'APK avec sauvegarde et rollback
        shell: bash
        env:
          BARKA_VPS_HOST: ${{ secrets.BARKA_VPS_HOST }}
          BARKA_VPS_USER: ${{ secrets.BARKA_VPS_USER }}
          BARKA_VPS_PORT: ${{ secrets.BARKA_VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${BARKA_VPS_PORT:-22}"
          TARGET="$BARKA_VPS_USER@$BARKA_VPS_HOST"
          PATCH_REMOTE="/tmp/barka-targeted-${GITHUB_RUN_ID}.py"
          APK_REMOTE="/tmp/barka-apk-${GITHUB_RUN_ID}.apk"
          PATCH_SHA="$(sha256sum backend/recovery/barka_vps_targeted.py | awk '{print $1}')"
          APK_SHA="$(sha256sum staged/BarkaTunnel-release.apk | awk '{print $1}')"
          scp -P "$PORT" -i "$HOME/.ssh/barka_vps_key" \
            backend/recovery/barka_vps_targeted.py "$TARGET:$PATCH_REMOTE"
          scp -P "$PORT" -i "$HOME/.ssh/barka_vps_key" \
            staged/BarkaTunnel-release.apk "$TARGET:$APK_REMOTE"

          ssh -p "$PORT" -i "$HOME/.ssh/barka_vps_key" "$TARGET" \
            "PATCH_REMOTE='$PATCH_REMOTE' APK_REMOTE='$APK_REMOTE' PATCH_SHA='$PATCH_SHA' APK_SHA='$APK_SHA' bash -se" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          umask 077
          ROOT=/opt/Barka-Tunnel/backend
          FINAL_APK="$ROOT/data/releases/BarkaTunnel.apk"
          FILES=(admin_panel.py admin_ops.py db.py main.py models.py)
          test -f "$ROOT/.env"
          test -d "$ROOT/data" && test -f "$ROOT/docker-compose.yml" && test -d "$ROOT/app"
          test "$(sha256sum "$PATCH_REMOTE" | awk '{print $1}')" = "$PATCH_SHA"
          test "$(sha256sum "$APK_REMOTE" | awk '{print $1}')" = "$APK_SHA"
          test ! -L "$FINAL_APK"

          # No changes if a running payment-capable production instance is not healthy.
          curl -fsS --max-time 15 http://127.0.0.1:8085/health | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") and d.get("payment_configured") else 1)'
          python3 "$PATCH_REMOTE" --root "$ROOT" --check
          BACKUP="$(mktemp -d /root/.barka-targeted-backup.XXXXXXXX)"
          for file in "${FILES[@]}"; do cp -a "$ROOT/app/$file" "$BACKUP/$file"; done
          OLD_APK=0
          if [ -f "$FINAL_APK" ]; then
            cp -a "$FINAL_APK" "$BACKUP/BarkaTunnel.apk"
            OLD_APK=1
          fi
          echo "SAFE_BACKUP=$BACKUP"
          STARTED=0
          SUCCEEDED=0
          rollback() {
            rc=$?
            trap - EXIT
            if [ "$STARTED" -eq 1 ] && [ "$SUCCEEDED" -ne 1 ]; then
              echo 'ROLLBACK: restoring exactly five original backend files'
              for file in "${FILES[@]}"; do cp -a "$BACKUP/$file" "$ROOT/app/$file"; done
              if [ "$OLD_APK" -eq 1 ]; then
                cp -a "$BACKUP/BarkaTunnel.apk" "$FINAL_APK"
              else
                rm -f "$FINAL_APK"
              fi
              (cd "$ROOT" && docker compose up -d --build) || echo 'ROLLBACK RESTART FAILED - inspect immediately'
              echo "BACKUP_RETAINED=$BACKUP"
            fi
            rm -f "$PATCH_REMOTE" "$APK_REMOTE"
            exit "$rc"
          }
          trap rollback EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          STARTED=1
          python3 "$PATCH_REMOTE" --root "$ROOT" --apply
          python3 -m py_compile \
            "$ROOT/app/admin_panel.py" "$ROOT/app/admin_ops.py" \
            "$ROOT/app/db.py" "$ROOT/app/main.py" "$ROOT/app/models.py"
          (cd "$ROOT" && docker compose up -d --build)
          curl -fsS --max-time 15 --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8085/health | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") and d.get("payment_configured") else 1)'
          install -d -m 755 "$(dirname "$FINAL_APK")"
          install -m 644 "$APK_REMOTE" "$FINAL_APK.new.${GITHUB_RUN_ID:-targeted}"
          mv -f "$FINAL_APK.new.${GITHUB_RUN_ID:-targeted}" "$FINAL_APK"
          test "$(sha256sum "$FINAL_APK" | awk '{print $1}')" = "$APK_SHA"
          SUCCEEDED=1
          echo 'TARGETED_BACKEND=DEPLOYED'
          echo 'APK_VERSION=2.4.1.2'
          echo 'APK_VERSION_CODE=145'
          echo "APK_SHA256=$APK_SHA"
          echo "SAFE_BACKUP=$BACKUP"
          REMOTE_SCRIPT
