name: Validation Barka lot 17
on:
  push:
    branches: ['validation/lot17-*']
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Installer SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Compiler et tester sans signature de production
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest
      - name: Conserver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-lot17
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
