name: Test Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"


      - name: Configurer la signature Android stable
        shell: bash
        env:
          BARKA_KEYSTORE_BASE64: ${{ secrets.BARKA_KEYSTORE_BASE64 }}
          BARKA_KEY_ALIAS_SECRET: ${{ secrets.BARKA_KEY_ALIAS }}
          BARKA_STORE_PASSWORD_SECRET: ${{ secrets.BARKA_STORE_PASSWORD }}
          BARKA_KEY_PASSWORD_SECRET: ${{ secrets.BARKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BARKA_KEYSTORE_BASE64" || { echo "Secret BARKA_KEYSTORE_BASE64 manquant"; exit 1; }
          test -n "$BARKA_KEY_ALIAS_SECRET" || { echo "Secret BARKA_KEY_ALIAS manquant"; exit 1; }
          test -n "$BARKA_STORE_PASSWORD_SECRET" || { echo "Secret BARKA_STORE_PASSWORD manquant"; exit 1; }
          test -n "$BARKA_KEY_PASSWORD_SECRET" || { echo "Secret BARKA_KEY_PASSWORD manquant"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/barka-tunnel-release.jks"
          printf '%s' "$BARKA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$BARKA_STORE_PASSWORD_SECRET" -alias "$BARKA_KEY_ALIAS_SECRET" >/dev/null
          echo "BARKA_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "BARKA_SIGNING_STORE_PASSWORD=$BARKA_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "BARKA_SIGNING_KEY_ALIAS=$BARKA_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          echo "BARKA_SIGNING_KEY_PASSWORD=$BARKA_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"

      - name: Compiler Barka Tunnel
        run: gradle assembleDebug

      - name: Publier APK Barka Tunnel
        uses: actions/upload-artifact@v4
        with:
          name: Barka-Tunnel-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
