name: Build propre Barka Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - validation/lot25-141
      - validation/lot26-141
      - validation/lot27-141
      - validation/lot29-complet

concurrency:
  group: barka-production-deploy
  cancel-in-progress: false

jobs:
  build-clean:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer exactement le commit courant
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Verifier le commit compile
        shell: bash
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          git status --short
          echo "===== HomeController.kt ====="
          sed -n '1,220p' app/src/main/java/com/barkatunnel/app/ui/home/HomeController.kt
          echo "===== HomeVpnCoordinator.kt ====="
          sed -n '1,220p' app/src/main/java/com/barkatunnel/app/ui/home/HomeVpnCoordinator.kt
          echo "===== HomeVpnResult.kt ====="
          sed -n '1,120p' app/src/main/java/com/barkatunnel/app/ui/home/HomeVpnResult.kt
          echo "===== HomeOrchestrator.kt ====="
          sed -n '1,180p' app/src/main/java/com/barkatunnel/app/ui/home/HomeOrchestrator.kt
          echo "===== Recherche doublons ====="
          find app/src/main -type f \( \
            -name 'HomeController.kt' -o \
            -name 'HomeVpnCoordinator.kt' -o \
            -name 'HomeVpnResult.kt' -o \
            -name 'HomeOrchestrator.kt' \
          \) -print

      - name: Installer Java 17 pour outils Android natifs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Go pour DNSTT
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Installer Python pour le backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verifier le backend et le panel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          PYTHONPATH=backend python -m pytest backend/tests -q
          node backend/tests/panel_lot21.test.cjs
          node backend/tests/panel_lot22.test.cjs
          node backend/tests/panel_lot23.test.cjs
          node backend/tests/panel_lot25.test.cjs

      - name: Préparer les moteurs natifs C6
        shell: bash
        run: bash ./scripts/c6_prepare_native.sh

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true


      - name: Configurer la signature Android stable
        shell: bash
        env:
          BARKA_KEYSTORE_BASE64: ${{ secrets.BARKA_KEYSTORE_BASE64 }}
          BARKA_KEY_ALIAS_SECRET: ${{ secrets.BARKA_KEY_ALIAS }}
          BARKA_STORE_PASSWORD_SECRET: ${{ secrets.BARKA_STORE_PASSWORD }}
          BARKA_KEY_PASSWORD_SECRET: ${{ secrets.BARKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BARKA_KEYSTORE_BASE64" || { echo "Secret BARKA_KEYSTORE_BASE64 manquant"; exit 1; }
          test -n "$BARKA_KEY_ALIAS_SECRET" || { echo "Secret BARKA_KEY_ALIAS manquant"; exit 1; }
          test -n "$BARKA_STORE_PASSWORD_SECRET" || { echo "Secret BARKA_STORE_PASSWORD manquant"; exit 1; }
          test -n "$BARKA_KEY_PASSWORD_SECRET" || { echo "Secret BARKA_KEY_PASSWORD manquant"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/barka-tunnel-release.jks"
          printf '%s' "$BARKA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$BARKA_STORE_PASSWORD_SECRET" -alias "$BARKA_KEY_ALIAS_SECRET" >/dev/null
          echo "BARKA_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "BARKA_SIGNING_STORE_PASSWORD=$BARKA_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "BARKA_SIGNING_KEY_ALIAS=$BARKA_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          echo "BARKA_SIGNING_KEY_PASSWORD=$BARKA_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"

      - name: Nettoyer totalement le projet
        shell: bash
        run: |
          rm -rf .gradle
          rm -rf build
          rm -rf app/build
          gradle --stop || true

      - name: Compiler Barka Tunnel sans cache
        run: gradle clean assembleRelease --no-daemon --no-build-cache --rerun-tasks --stacktrace

      - name: Verifier sauvegarde et restauration de la consommation
        run: gradle testReleaseUnitTest --no-daemon --no-build-cache --stacktrace

      - name: Verifier les moteurs ARM64 et ARMv7 dans APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SOURCE"
          APK_ENTRIES="$(unzip -Z1 "$APK_SOURCE")"
          for abi in arm64-v8a armeabi-v7a; do
            for core in libbarka_xray.so libbarka_dnstt.so libtun2socks.so; do
              grep -Fxq "lib/$abi/$core" <<< "$APK_ENTRIES" || {
                echo "Moteur absent de APK: lib/$abi/$core"
                exit 1
              }
            done
          done

      - name: Preparer APK telechargeable
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SOURCE"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose --print-certs "$APK_SOURCE" | tee apk-verification.txt
          grep -Fq '012ff8a1b08a66dd72d1741da1da44054bc307a20a4bf2be3c7de51b8383100c' apk-verification.txt
          python3 -c 'import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); sys.exit("APK corrompu: "+bad if bad else 0)' "$APK_SOURCE"
          cp "$APK_SOURCE" BarkaTunnel-release.apk
          sha256sum BarkaTunnel-release.apk

      - name: Publier artifact APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: BarkaTunnel-APK
          path: BarkaTunnel-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier backend et APK directement sur le VPS
        shell: bash
        env:
          BARKA_VPS_HOST: ${{ secrets.BARKA_VPS_HOST }}
          BARKA_VPS_USER: ${{ secrets.BARKA_VPS_USER }}
          BARKA_VPS_SSH_KEY: ${{ secrets.BARKA_VPS_SSH_KEY }}
          BARKA_VPS_PORT: ${{ secrets.BARKA_VPS_PORT }}
        run: |
          set -Eeuo pipefail
          DEPLOY_STAGE="configuration SSH"
          trap 'rc=$?; echo "Échec étape: $DEPLOY_STAGE (code $rc, ligne $LINENO)" >&2; exit "$rc"' ERR
          retry_transfer() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              echo "Transfert interrompu, tentative $attempt/3" >&2
              sleep 3
            done
            return 1
          }
          test -n "$BARKA_VPS_HOST" || { echo "Secret BARKA_VPS_HOST manquant"; exit 1; }
          test -n "$BARKA_VPS_USER" || { echo "Secret BARKA_VPS_USER manquant"; exit 1; }
          test -n "$BARKA_VPS_SSH_KEY" || { echo "Secret BARKA_VPS_SSH_KEY manquant"; exit 1; }

          VPS_PORT="${BARKA_VPS_PORT:-22}"
          REMOTE_TMP="/tmp/BarkaTunnel-${GITHUB_SHA}.apk"
          BACKEND_ARCHIVE="BarkaBackend-${GITHUB_SHA}.tar.gz"
          REMOTE_BACKEND="/tmp/${BACKEND_ARCHIVE}"
          REMOTE_APK="/opt/Barka-Tunnel/backend/data/releases/BarkaTunnel.apk"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$BARKA_VPS_SSH_KEY" > "$HOME/.ssh/barka_vps_key"
          chmod 600 "$HOME/.ssh/barka_vps_key"
          DEPLOY_STAGE="lecture de la clé SSH"
          scan_host() { ssh-keyscan -T 20 -p "$VPS_PORT" -H "$BARKA_VPS_HOST" > "$HOME/.ssh/barka_known_hosts.new"; }
          retry_transfer scan_host
          test -s "$HOME/.ssh/barka_known_hosts.new"
          cat "$HOME/.ssh/barka_known_hosts.new" >> "$HOME/.ssh/known_hosts"
          SSH_OPTIONS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          DEPLOY_STAGE="connexion SSH"
          retry_transfer ssh "${SSH_OPTIONS[@]}" -p "$VPS_PORT" -i "$HOME/.ssh/barka_vps_key" "$BARKA_VPS_USER@$BARKA_VPS_HOST" true
          DEPLOY_STAGE="transfert APK et backend"

          LOCAL_SHA256="$(sha256sum BarkaTunnel-release.apk | awk '{print $1}')"
          tar -C backend --exclude=__pycache__ -czf "$BACKEND_ARCHIVE" app deploy_baseline.json verify_deploy.py
          BACKEND_SHA256="$(sha256sum "$BACKEND_ARCHIVE" | awk '{print $1}')"
          retry_transfer scp "${SSH_OPTIONS[@]}" -P "$VPS_PORT" -i "$HOME/.ssh/barka_vps_key" \
            BarkaTunnel-release.apk \
            "$BARKA_VPS_USER@$BARKA_VPS_HOST:$REMOTE_TMP"
          retry_transfer scp "${SSH_OPTIONS[@]}" -P "$VPS_PORT" -i "$HOME/.ssh/barka_vps_key" \
            "$BACKEND_ARCHIVE" \
            "$BARKA_VPS_USER@$BARKA_VPS_HOST:$REMOTE_BACKEND"

          DEPLOY_STAGE="sauvegarde et déploiement serveur"
          REMOTE_RESULT="$(ssh "${SSH_OPTIONS[@]}" -p "$VPS_PORT" -i "$HOME/.ssh/barka_vps_key" \
            "$BARKA_VPS_USER@$BARKA_VPS_HOST" \
            "BARKA_DEPLOY_SHA='$GITHUB_SHA' BARKA_EXPECTED_APK_SHA='$LOCAL_SHA256' BARKA_REMOTE_APK='$REMOTE_TMP' BARKA_REMOTE_BACKEND='$REMOTE_BACKEND' BARKA_BACKEND_SHA256='$BACKEND_SHA256' BARKA_FINAL_APK='$REMOTE_APK' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          trap 'rc=$?; echo "Échec distant ligne $LINENO (code $rc)" >&2; exit "$rc"' ERR
          BARKA_BACKEND_ROOT="/opt/Barka-Tunnel/backend"
          exec 9>/tmp/barka-backend-deploy.lock
          flock -n 9 || { echo "Un déploiement est déjà en cours."; exit 1; }
          install -d -m 700 /opt/Barka-Tunnel/backups
          BARKA_BACKUP_ROOT="$(mktemp -d /opt/Barka-Tunnel/backups/lot27.XXXXXX)"

          test "$(sha256sum "$BARKA_REMOTE_APK" | awk '{print $1}')" = "$BARKA_EXPECTED_APK_SHA"
          test -f "$BARKA_BACKEND_ROOT/.env"
          test -d "$BARKA_BACKEND_ROOT/data"
          test -f "$BARKA_BACKEND_ROOT/docker-compose.yml"
          test -d "$BARKA_BACKEND_ROOT/app"
          test "$(sha256sum "$BARKA_REMOTE_BACKEND" | awk '{print $1}')" = "$BARKA_BACKEND_SHA256"

          BARKA_STAGE="$(mktemp -d /tmp/BarkaBackendStage.XXXXXX)"
          tar -xzf "$BARKA_REMOTE_BACKEND" -C "$BARKA_STAGE"
          python3 "$BARKA_STAGE/verify_deploy.py" "$BARKA_BACKEND_ROOT" "$BARKA_STAGE"
          rm -rf "$BARKA_STAGE"

          install -d -m 700 "$BARKA_BACKUP_ROOT"
          cp -a "$BARKA_BACKEND_ROOT/app" "$BARKA_BACKUP_ROOT/app"
          docker exec barka-backend python -c 'import sqlite3; from app.config import settings; src=sqlite3.connect("file:"+settings.database_path+"?mode=ro", uri=True); dst=sqlite3.connect("/tmp/barka-predeploy.db"); src.backup(dst); dst.close(); src.close()'
          docker cp barka-backend:/tmp/barka-predeploy.db "$BARKA_BACKUP_ROOT/database.sqlite"
          chmod 600 "$BARKA_BACKUP_ROOT/database.sqlite"
          docker exec barka-backend rm -f /tmp/barka-predeploy.db
          if test -f "$BARKA_FINAL_APK"; then cp -a "$BARKA_FINAL_APK" "$BARKA_BACKUP_ROOT/BarkaTunnel.apk"; fi

          if ! (
            tar -xzf "$BARKA_REMOTE_BACKEND" -C "$BARKA_BACKEND_ROOT" &&
            cd "$BARKA_BACKEND_ROOT" &&
            docker compose up -d --build --no-deps barka-backend &&
            curl -fsS --retry 10 --retry-delay 2 --retry-all-errors \
              http://127.0.0.1:8085/health | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") and d.get("payment_configured") else 1)'
          ); then
            mv "$BARKA_BACKEND_ROOT/app" "$BARKA_BACKUP_ROOT/app-failed"
            cp -a "$BARKA_BACKUP_ROOT/app" "$BARKA_BACKEND_ROOT/app"
            (
              cd "$BARKA_BACKEND_ROOT"
              docker compose up -d --build --no-deps barka-backend
            )
            echo "Le nouveau backend a échoué : ancienne version restaurée."
            exit 1
          fi

          docker exec barka-backend python -m app.duration_audit

          install -d -m 755 "$(dirname "$BARKA_FINAL_APK")"
          install -m 644 "$BARKA_REMOTE_APK" "${BARKA_FINAL_APK}.new"
          mv -f "${BARKA_FINAL_APK}.new" "$BARKA_FINAL_APK"
          APK_SHA256="$(sha256sum "$BARKA_FINAL_APK" | awk '{print $1}')"
          rm -f "$BARKA_REMOTE_APK" "$BARKA_REMOTE_BACKEND"
          echo "Sauvegarde conservée : $BARKA_BACKUP_ROOT"
          echo "BACKEND_DEPLOYED=$BARKA_DEPLOY_SHA"
          echo "APK_SHA256=$APK_SHA256"
          REMOTE_SCRIPT
          )"

          printf '%s\n' "$REMOTE_RESULT"
          REMOTE_SHA256="$(printf '%s\n' "$REMOTE_RESULT" | sed -n 's/^APK_SHA256=//p' | tail -n 1)"

          test -n "$REMOTE_SHA256" || { echo "SHA256 distant absent"; exit 1; }
          test "$LOCAL_SHA256" = "$REMOTE_SHA256" || { echo "SHA256 distant incorrect"; exit 1; }
          DEPLOY_STAGE="vérification publique (backend et APK déjà publiés)"
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 1200 \
            "https://api.rhaffservice.com/downloads/BarkaTunnel.apk?build=$GITHUB_SHA" -o published-check.apk
          test "$(sha256sum published-check.apk | awk '{print $1}')" = "$LOCAL_SHA256" || { echo "Le téléchargement public ne correspond pas à l’APK vérifié"; exit 1; }
          echo "APK publié et téléchargement vérifié: https://api.rhaffservice.com/downloads/BarkaTunnel.apk?build=$GITHUB_SHA"
          echo "SHA256=$REMOTE_SHA256"
