name: Build propre Barka Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-clean:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer exactement le commit courant
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Verifier le commit compile
        shell: bash
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          git status --short
          echo "===== HomeController.kt ====="
          sed -n '1,220p' app/src/main/java/com/barkatunnel/app/ui/home/HomeController.kt
          echo "===== HomeVpnCoordinator.kt ====="
          sed -n '1,220p' app/src/main/java/com/barkatunnel/app/ui/home/HomeVpnCoordinator.kt
          echo "===== HomeVpnResult.kt ====="
          sed -n '1,120p' app/src/main/java/com/barkatunnel/app/ui/home/HomeVpnResult.kt
          echo "===== HomeOrchestrator.kt ====="
          sed -n '1,180p' app/src/main/java/com/barkatunnel/app/ui/home/HomeOrchestrator.kt
          echo "===== Recherche doublons ====="
          find app/src/main -type f \( \
            -name 'HomeController.kt' -o \
            -name 'HomeVpnCoordinator.kt' -o \
            -name 'HomeVpnResult.kt' -o \
            -name 'HomeOrchestrator.kt' \
          \) -print

      - name: Installer Java 17 pour outils Android natifs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Go pour DNSTT
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Préparer les moteurs natifs C6
        shell: bash
        run: bash ./scripts/c6_prepare_native.sh

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true


      - name: Configurer la signature Android stable
        shell: bash
        env:
          BARKA_KEYSTORE_BASE64: ${{ secrets.BARKA_KEYSTORE_BASE64 }}
          BARKA_KEY_ALIAS_SECRET: ${{ secrets.BARKA_KEY_ALIAS }}
          BARKA_STORE_PASSWORD_SECRET: ${{ secrets.BARKA_STORE_PASSWORD }}
          BARKA_KEY_PASSWORD_SECRET: ${{ secrets.BARKA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BARKA_KEYSTORE_BASE64" || { echo "Secret BARKA_KEYSTORE_BASE64 manquant"; exit 1; }
          test -n "$BARKA_KEY_ALIAS_SECRET" || { echo "Secret BARKA_KEY_ALIAS manquant"; exit 1; }
          test -n "$BARKA_STORE_PASSWORD_SECRET" || { echo "Secret BARKA_STORE_PASSWORD manquant"; exit 1; }
          test -n "$BARKA_KEY_PASSWORD_SECRET" || { echo "Secret BARKA_KEY_PASSWORD manquant"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/barka-tunnel-release.jks"
          printf '%s' "$BARKA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$BARKA_STORE_PASSWORD_SECRET" -alias "$BARKA_KEY_ALIAS_SECRET" >/dev/null
          echo "BARKA_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "BARKA_SIGNING_STORE_PASSWORD=$BARKA_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "BARKA_SIGNING_KEY_ALIAS=$BARKA_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          echo "BARKA_SIGNING_KEY_PASSWORD=$BARKA_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"

      - name: Nettoyer totalement le projet
        shell: bash
        run: |
          rm -rf .gradle
          rm -rf build
          rm -rf app/build
          gradle --stop || true

      - name: Compiler Barka Tunnel sans cache
        run: gradle clean assembleRelease --no-daemon --no-build-cache --rerun-tasks --stacktrace

      - name: Preparer APK telechargeable
        shell: bash
        run: |
          set -e
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SOURCE"
          cp "$APK_SOURCE" BarkaTunnel-release.apk
          sha256sum BarkaTunnel-release.apk

      - name: Publier APK dans Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BarkaTunnel-APK
          path: BarkaTunnel-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
